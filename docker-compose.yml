# =============================================================================
# Agricultura IoT - Plataforma FIWARE
# =============================================================================
# Despliega en una instancia EC2 (Ubuntu) la plataforma FIWARE que recibe las
# lecturas de los sensores del cultivo, guarda su estado actual y su historico,
# y las muestra en tableros.
#
# Flujo de los datos:
#
#   Sensor --HTTP+clave--> Gestor --> Orion (estado actual) --suscripcion--> QuantumLeap
#                                    |       |                                  |
#                                 MongoDB    +--suscripcion--> alertas      CrateDB (historico crudo)
#                                              (umbrales -> correo)             |
#                                                     |                    limpieza (cada 15 min o con boton)
#                                                     |                        |
#                                                     +------------------> Postgres (datos limpios
#                                                                          y alertas) --> Grafana,
#                                                                          gestor y landing
#
# Puertos expuestos en la instancia:
#   80    Gestor       front y API para administrar Orion (requiere login) y entrada de
#                      lecturas de los sensores (requiere la clave de cada dispositivo)
#   443   Landing      pagina publica con lecturas, historico limpio y alertas (sin login, HTTP)
#   3000  Grafana      tableros de visualizacion
#
# Solo en la propia instancia (127.0.0.1), porque no tienen autenticacion: nadie de
# afuera puede escribir ni borrar datos. Desde tu equipo se usan con un tunel SSH, ej.
#   ssh -i llave.pem -L 4200:localhost:4200 ubuntu@<host>   y abrir http://localhost:4200
#   1026  Orion        API NGSI (v2 y NGSI-LD)
#   8668  QuantumLeap  API de series de tiempo
#   4200  CrateDB      consola web / API SQL   (4300 transporte interno)
#   5432  CrateDB      protocolo PostgreSQL
#   27017 MongoDB      base de datos de Orion
# Postgres, limpieza y alertas no se publican: solo se usan dentro de la red de Docker.
#
# Credenciales de Postgres y del correo de las alertas: archivo .env en esta carpeta (ver .env.example).
#
# Todos los servicios tienen restart: unless-stopped para que vuelvan a
# arrancar solos cuando la instancia se apaga y se enciende.
#
# Antes de levantarlo, CrateDB necesita vm.max_map_count >= 262144 en el host
# (ver README.md).
# =============================================================================
version: "3.8"
services:
  # ---------------------------------------------------------------------------
  # Orion-LD: Context Broker. Guarda el estado actual de cada sensor (entidad)
  # y notifica a QuantumLeap cada vez que un valor cambia.
  # Acepta tanto la API NGSI-v2 (/v2/...) como NGSI-LD (/ngsi-ld/v1/...).
  # ---------------------------------------------------------------------------
  orion:
    image: fiware/orion-ld
    hostname: orion
    container_name: orion
    restart: unless-stopped
    depends_on:
      - mongo-db
    networks:
      - default
    expose:
      - "1026"
    ports:
      - "127.0.0.1:1026:1026" # solo desde la instancia; los sensores entran por el gestor
    command: -dbhost mongo-db -logLevel DEBUG
    healthcheck:
      test: ["CMD-SHELL", "curl --fail -s http://localhost:1026/version || exit 1"]
      interval: 10m0s
      timeout: 30s
      retries: 5
      start_period: 30s

  # ---------------------------------------------------------------------------
  # QuantumLeap: recibe las notificaciones de Orion y guarda cada lectura como
  # serie de tiempo en CrateDB (historico de las variables del cultivo).
  # ---------------------------------------------------------------------------
  quantumleap:
    image: orchestracities/quantumleap
    hostname: quantumleap
    container_name: fiware-quantumleap
    restart: unless-stopped
    ports:
      - "127.0.0.1:8668:8668"
    depends_on:
      - crate-db
    environment:
      - CRATE_HOST=crate-db
      - LOGLEVEL=DEBUG

  # ---------------------------------------------------------------------------
  # MongoDB: base de datos de Orion (entidades y suscripciones).
  # La version de Orion-LD actual exige MongoDB 4.2 o superior; con mongo:3.6
  # Orion se cae al arrancar con "wire version 6 ... requires at least 8".
  # ---------------------------------------------------------------------------
  mongo-db:
    image: mongo:4.4
    hostname: mongo-db
    container_name: db-mongo
    restart: unless-stopped
    expose:
      - "27017"
    ports:
      - "127.0.0.1:27017:27017"
    networks:
      - default
    volumes:
      - mongo-db:/data/db

  # ---------------------------------------------------------------------------
  # CrateDB: base de datos de series de tiempo donde QuantumLeap guarda el
  # historico. Cada tipo de entidad queda en una tabla doc.et<tipo>.
  # ---------------------------------------------------------------------------
  crate-db:
    image: crate
    hostname: crate-db
    container_name: db-crate
    restart: unless-stopped
    ports:
      - "127.0.0.1:4200:4200"
      - "127.0.0.1:4300:4300"
      - "127.0.0.1:5432:5432"
    command: crate -Cauth.host_based.enabled=false  -Ccluster.name=democluster -Chttp.cors.enabled=true -Chttp.cors.allow-origin="*"
    environment:
      - CRATE_HEAP_SIZE=4g
    volumes:
      - crate-db:/data

  # ---------------------------------------------------------------------------
  # Grafana: tableros con los datos ya limpios de Postgres. La fuente de datos y
  # el tablero "Agricultura IoT · Datos limpios" se crean solos desde ./grafana
  # (provisioning). Tambien se puede agregar CrateDB a mano (host crate-db:5432).
  # ---------------------------------------------------------------------------
  grafana:
    image: grafana/grafana
    container_name: grafana
    restart: unless-stopped
    depends_on:
      - crate-db
      - postgres
    ports:
      - "3000:3000"
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agricultura}
      - POSTGRES_USER=${POSTGRES_USER:-agricultura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}
    volumes:
      - grafana:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/etc/grafana/dashboards:ro

  # ---------------------------------------------------------------------------
  # Postgres: base de datos con las lecturas ya limpias (promedios cada 5 min),
  # lo descartado y el registro de cada limpieza. La lee Grafana.
  # Sin puerto publicado: el 5432 del host ya lo usa CrateDB.
  # ---------------------------------------------------------------------------
  postgres:
    image: postgres:16-alpine
    hostname: postgres
    container_name: db-postgres
    restart: unless-stopped
    environment:
      - POSTGRES_DB=${POSTGRES_DB:-agricultura}
      - POSTGRES_USER=${POSTGRES_USER:-agricultura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}
    expose:
      - "5432"
    volumes:
      - postgres-db:/var/lib/postgresql/data

  # ---------------------------------------------------------------------------
  # Limpieza: lee el historico crudo de CrateDB, descarta lecturas imposibles,
  # picos y duplicados, y guarda los promedios en Postgres. Corre sola cada
  # LIMPIEZA_INTERVALO_MIN minutos y tambien con el boton del gestor.
  # ---------------------------------------------------------------------------
  limpieza:
    build: ./limpieza
    container_name: limpieza
    restart: unless-stopped
    depends_on:
      - crate-db
      - postgres
    environment:
      - CRATE_URL=http://crate-db:4200
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-agricultura}
      - POSTGRES_USER=${POSTGRES_USER:-agricultura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}
      - LIMPIEZA_INTERVALO_MIN=${LIMPIEZA_INTERVALO_MIN:-15}
      - LIMPIEZA_INTERVALO_DATOS_MIN=${LIMPIEZA_INTERVALO_DATOS_MIN:-5}

  # ---------------------------------------------------------------------------
  # Alertas: manejador de mensajes. Crea una suscripcion en Orion que le notifica
  # cada lectura, la compara con los umbrales (tabla umbrales de Postgres, se
  # editan en el gestor), registra las alertas y avisa por correo si hay
  # SMTP_USUARIO y SMTP_PASSWORD en .env. Sin puerto publico.
  # ---------------------------------------------------------------------------
  alertas:
    build: ./alertas
    container_name: alertas
    restart: unless-stopped
    depends_on:
      - orion
      - postgres
    environment:
      - ORION_URL=http://orion:1026
      - ALERTAS_URL_NOTIFICACION=http://alertas:8000/notify
      - POSTGRES_HOST=postgres
      - POSTGRES_DB=${POSTGRES_DB:-agricultura}
      - POSTGRES_USER=${POSTGRES_USER:-agricultura}
      - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:?Falta POSTGRES_PASSWORD en .env (ver .env.example)}
      - ALERTAS_CONFIRMAR_LECTURAS=${ALERTAS_CONFIRMAR_LECTURAS:-2}
      - SMTP_HOST=${SMTP_HOST:-smtp.gmail.com}
      - SMTP_PORT=${SMTP_PORT:-587}
      - SMTP_USUARIO=${SMTP_USUARIO:-}
      - SMTP_PASSWORD=${SMTP_PASSWORD:-}
      - ALERTAS_CORREO_DESTINO=${ALERTAS_CORREO_DESTINO:-}

  # ---------------------------------------------------------------------------
  # Gestor: API (FastAPI) + front (React) para administrar las entidades y
  # suscripciones de Orion con usuario y contrasena, ver su historico crudo
  # (QuantumLeap) o limpio (Postgres), exportarlo, lanzar la limpieza de datos y
  # configurar las alertas. Se construye desde
  # ./gestor y lee las credenciales de gestor/.env (ver gestor/.env.example).
  # Docs de la API en http://<host>/docs
  # ---------------------------------------------------------------------------
  gestor:
    build: ./gestor
    container_name: gestor
    depends_on:
      - orion
      - quantumleap
    networks:
      - default
    ports:
      - "80:8000"
    environment:
      - ORION_URL=http://orion:1026
      - QUANTUMLEAP_URL=http://quantumleap:8668
      - LIMPIEZA_URL=http://limpieza:8000
      - ALERTAS_URL=http://alertas:8000
    env_file:
      - ./gestor/.env
    restart: unless-stopped

  # ---------------------------------------------------------------------------
  # Landing: pagina publica (sin login) con las lecturas actuales de Orion, el
  # historico ya limpio (Postgres, via el servicio de limpieza) y las alertas
  # activas. Su API es de solo lectura. Se construye desde ./landing con el mismo
  # stack del gestor (FastAPI + React).
  # Se publica en el 443 pero sirve HTTP plano: abrir con http://<host>:443
  # ---------------------------------------------------------------------------
  landing:
    build: ./landing
    container_name: landing
    depends_on:
      - orion
      - limpieza
      - alertas
    networks:
      - default
    ports:
      - "443:8000"
    environment:
      - ORION_URL=http://orion:1026
      - LIMPIEZA_URL=http://limpieza:8000
      - ALERTAS_URL=http://alertas:8000
    restart: unless-stopped

networks:
  default:
    ipam:
      config:
        - subnet: 172.19.1.0/24

# Volumenes persistentes: los datos sobreviven a "docker compose down"
# (se borran solo con "docker compose down -v").
volumes:
  mongo-db: ~
  crate-db: ~
  grafana: ~
  postgres-db: ~
