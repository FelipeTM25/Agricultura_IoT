; Nodo sensor del proyecto Agricultura IoT: LilyGO T-Beam (ESP32) que lee los
; sensores del cultivo y envia las lecturas a Orion por WiFi.
;
; Antes de compilar: copiar include/secretos.example.h como include/secretos.h
; y poner ahi la red WiFi y el host de Orion.
;
; https://docs.platformio.org/page/projectconf.html

[env:t-beam]
platform = espressif32
board = ttgo-t-beam
framework = arduino
monitor_speed = 115200
lib_deps =
	lewisxhe/XPowersLib@^0.3.3
	olikraus/U8g2@^2.36.18
	mikalhart/TinyGPSPlus@^1.1.0
	closedcube/ClosedCube HDC1080@^1.3.2
